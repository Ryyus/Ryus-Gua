name: Publish v1.3.0 final

on:
  pull_request:
    branches: ["main"]
    paths:
      - "v130-publish-trigger.txt"

permissions:
  contents: write

env:
  STANDARD_SHA: ec3c526c5fbc108091848909e632476bb4133b3803274d916318150276a00913
  LEGACY_SHA: 41f491e5b389cfb42b5706db335308f45da43c9309c77eb2903837b3488ff772
  CERT_SHA: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d
  UNSIGNED_ARTIFACT_ID: "9440043382"

jobs:
  prepare:
    if: github.head_ref == 'v1.3.0-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.3.0-mirror
          fetch-depth: 0
      - name: Restore exact signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd unzip
          mkdir -p /tmp/unsigned dist
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${UNSIGNED_ARTIFACT_ID}/zip" > /tmp/unsigned.zip
          unzip -q /tmp/unsigned.zip -d /tmp/unsigned
          zstd -d --patch-from=/tmp/unsigned/RyusGua-v1.3.0-standard-unsigned-aligned.apk \
            release/v1.3.0/standard.patch.zst -o dist/RyusGua-v1.3.0-standard.apk -f
          zstd -d --patch-from=/tmp/unsigned/RyusGua-v1.3.0-legacy-unsigned-aligned.apk \
            release/v1.3.0/legacy.patch.zst -o dist/RyusGua-v1.3.0-legacy.apk -f
          echo "$STANDARD_SHA  dist/RyusGua-v1.3.0-standard.apk" | sha256sum -c -
          echo "$LEGACY_SHA  dist/RyusGua-v1.3.0-legacy.apk" | sha256sum -c -
          java -jar /tmp/unsigned/apksigner.jar verify --print-certs dist/RyusGua-v1.3.0-standard.apk | tee /tmp/std-cert.txt
          java -jar /tmp/unsigned/apksigner.jar verify --print-certs dist/RyusGua-v1.3.0-legacy.apk | tee /tmp/legacy-cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $CERT_SHA" /tmp/std-cert.txt
          grep -qi "Signer #1 certificate SHA-256 digest: $CERT_SHA" /tmp/legacy-cert.txt
          printf '%s  %s\n%s  %s\n' \
            "$STANDARD_SHA" "RyusGua-v1.3.0-standard.apk" \
            "$LEGACY_SHA" "RyusGua-v1.3.0-legacy.apk" > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: dist/*
          retention-days: 30

  smoke-legacy:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: dist
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r dist/RyusGua-v1.3.0-legacy.apk
            adb shell am force-stop com.ryusgua.app
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 6
            adb shell ps | grep -q com.ryusgua.app

  smoke-standard:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: dist
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r dist/RyusGua-v1.3.0-standard.apk
            adb shell am force-stop com.ryusgua.app
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 6
            adb shell ps | grep -q com.ryusgua.app

  publish:
    needs: [prepare, smoke-legacy, smoke-standard]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: dist
      - name: Commit immutable CDN mirror
        id: mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p update/releases/v1.3.0
          cp dist/RyusGua-v1.3.0-standard.apk update/releases/v1.3.0/
          cp dist/RyusGua-v1.3.0-legacy.apk update/releases/v1.3.0/
          cp dist/SHA256SUMS.txt update/releases/v1.3.0/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/releases/v1.3.0
          if ! git diff --cached --quiet; then
            git commit -m "Add v1.3.0 signed CDN mirror"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          MIRROR_SHA='${{ steps.mirror.outputs.sha }}'
          gh release create v1.3.0 \
            dist/RyusGua-v1.3.0-standard.apk \
            dist/RyusGua-v1.3.0-legacy.apk \
            dist/SHA256SUMS.txt \
            --target "$MIRROR_SHA" \
            --title "柳之卦 v1.3.0 / Ryu's Gua 1.3.0" \
            --notes "设置页面同步主界面视觉并改用现代开关；新增开屏进度设置；新装默认开启音效、动效与垂直翻转；正式起卦加入五分钟节制规则，取消不计入，五分钟内完成两次普通起卦也会暂缓正式起卦；更新检查与 APK 下载新增 jsDelivr 国内优先、GitHub 兜底。"
      - name: Verify public GitHub assets and jsDelivr mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/public && mkdir -p /tmp/public
          gh release download v1.3.0 --pattern '*.apk' --dir /tmp/public
          echo "$STANDARD_SHA  /tmp/public/RyusGua-v1.3.0-standard.apk" | sha256sum -c -
          echo "$LEGACY_SHA  /tmp/public/RyusGua-v1.3.0-legacy.apk" | sha256sum -c -
          STD_CDN='https://cdn.jsdelivr.net/gh/Ryyus/Ryus-Gua@v1.3.0/update/releases/v1.3.0/RyusGua-v1.3.0-standard.apk'
          LEG_CDN='https://cdn.jsdelivr.net/gh/Ryyus/Ryus-Gua@v1.3.0/update/releases/v1.3.0/RyusGua-v1.3.0-legacy.apk'
          for i in $(seq 1 18); do
            if curl -fL --connect-timeout 8 --max-time 25 "$STD_CDN" -o /tmp/std-cdn.apk \
              && curl -fL --connect-timeout 8 --max-time 25 "$LEG_CDN" -o /tmp/leg-cdn.apk; then
              break
            fi
            sleep 10
          done
          echo "$STANDARD_SHA  /tmp/std-cdn.apk" | sha256sum -c -
          echo "$LEGACY_SHA  /tmp/leg-cdn.apk" | sha256sum -c -
