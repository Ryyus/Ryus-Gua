name: Publish v1.3.0 final

on:
  pull_request:
    branches: ["main"]
    paths:
      - "release/v130-final-trigger.txt"

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    if: github.head_ref == 'v1.3.0-mirror'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-unsigned-release-candidate
          path: unsigned
          github-token: ${{ github.token }}
          run-id: 32464107684
      - name: Fetch and verify final tagged APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p signed
          curl -L --fail --retry 5 --retry-delay 3 -o signed/RyusGua-v1.3.0-standard.apk "https://raw.githubusercontent.com/Ryyus/Ryus-Gua/v1.3.0/update/releases/v1.3.0/RyusGua-v1.3.0-standard.apk"
          curl -L --fail --retry 5 --retry-delay 3 -o signed/RyusGua-v1.3.0-legacy.apk "https://raw.githubusercontent.com/Ryyus/Ryus-Gua/v1.3.0/update/releases/v1.3.0/RyusGua-v1.3.0-legacy.apk"
          echo "ec3c526c5fbc108091848909e632476bb4133b3803274d916318150276a00913  signed/RyusGua-v1.3.0-standard.apk" | sha256sum -c -
          echo "41f491e5b389cfb42b5706db335308f45da43c9309c77eb2903837b3488ff772  signed/RyusGua-v1.3.0-legacy.apk" | sha256sum -c -
          java -jar unsigned/apksigner.jar verify --verbose --print-certs signed/RyusGua-v1.3.0-standard.apk | tee standard-cert.txt
          java -jar unsigned/apksigner.jar verify --verbose --print-certs signed/RyusGua-v1.3.0-legacy.apk | tee legacy-cert.txt
          grep -qi "14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d" standard-cert.txt
          grep -qi "14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d" legacy-cert.txt
          (cd signed && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: signed/*
          retention-days: 30

  legacy-smoke:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: signed
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r signed/RyusGua-v1.3.0-legacy.apk
            adb logcat -c
            adb shell monkey -p com.ryusgua.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.ryusgua.app | grep -E '[0-9]+'
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com\.ryusgua\.app|Process: com\.ryusgua\.app.*FATAL'

  standard-smoke:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: signed
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r signed/RyusGua-v1.3.0-standard.apk
            adb logcat -c
            adb shell monkey -p com.ryusgua.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.ryusgua.app | grep -E '[0-9]+'
            ! adb logcat -d | grep -E 'FATAL EXCEPTION.*com\.ryusgua\.app|Process: com\.ryusgua\.app.*FATAL'

  publish:
    needs: [prepare, legacy-smoke, standard-smoke]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1.3.0-signed-final
          path: signed
      - name: Create or complete GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          NOTES='设置页统一为现代深色卡片与开关；新增开屏进度开关并调整新安装默认项；正式起卦加入五分钟节制规则，取消不计入，五分钟内两次普通成卦也会暂缓正式起卦；更新检查改为 jsDelivr 国内优先、GitHub 兜底。\n\nSettings were modernized, boot-progress control and new defaults were added, Formal Casting gained a five-minute guard, and updates now use a jsDelivr-first multi-source path with GitHub fallback.'
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 signed/RyusGua-v1.3.0-standard.apk signed/RyusGua-v1.3.0-legacy.apk signed/SHA256SUMS.txt --clobber
            gh release edit v1.3.0 --title "柳之卦 v1.3.0 / Ryu's Gua 1.3.0" --notes "$NOTES"
          else
            gh release create v1.3.0 signed/RyusGua-v1.3.0-standard.apk signed/RyusGua-v1.3.0-legacy.apk signed/SHA256SUMS.txt --title "柳之卦 v1.3.0 / Ryu's Gua 1.3.0" --notes "$NOTES"
          fi
      - name: Verify public Release downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify
          curl -L --fail --retry 5 --retry-delay 3 -o verify/standard.apk "https://github.com/Ryyus/Ryus-Gua/releases/download/v1.3.0/RyusGua-v1.3.0-standard.apk"
          curl -L --fail --retry 5 --retry-delay 3 -o verify/legacy.apk "https://github.com/Ryyus/Ryus-Gua/releases/download/v1.3.0/RyusGua-v1.3.0-legacy.apk"
          echo "ec3c526c5fbc108091848909e632476bb4133b3803274d916318150276a00913  verify/standard.apk" | sha256sum -c -
          echo "41f491e5b389cfb42b5706db335308f45da43c9309c77eb2903837b3488ff772  verify/legacy.apk" | sha256sum -c -
      - name: Verify jsDelivr mirror
        shell: bash
        run: |
          set -euo pipefail
          for flavor in standard legacy; do
            if [ "$flavor" = standard ]; then expected="ec3c526c5fbc108091848909e632476bb4133b3803274d916318150276a00913"; else expected="41f491e5b389cfb42b5706db335308f45da43c9309c77eb2903837b3488ff772"; fi
            ok=0
            for i in 1 2 3 4 5 6; do
              if curl -L --fail --max-time 30 -o "verify/cdn-$flavor.apk" "https://cdn.jsdelivr.net/gh/Ryyus/Ryus-Gua@v1.3.0/update/releases/v1.3.0/RyusGua-v1.3.0-$flavor.apk"; then ok=1; break; fi
              sleep 10
            done
            test "$ok" = 1
            echo "$expected  verify/cdn-$flavor.apk" | sha256sum -c -
          done
