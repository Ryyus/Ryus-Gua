name: Publish verified Ryu's Gua v1.1.1

on:
  pull_request:
    branches: ["main"]
    paths: ["release-transfer-v111/**"]

permissions:
  contents: write
  actions: read

jobs:
  reconstruct:
    if: github.head_ref == 'v1.1.1-publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1-publish
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified unsigned release candidate
        uses: actions/download-artifact@v4
        with:
          name: v1.1.1-unsigned-release-candidate
          path: unsigned
          github-token: ${{ github.token }}
          run-id: 32385761846
      - name: Reconstruct and verify formally signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/v111-patches
          cat release-transfer-v111/std.part* | base64 -d > /tmp/v111-patches/standard.zst
          cat release-transfer-v111/leg.part* | base64 -d > /tmp/v111-patches/legacy.zst
          echo '1afe6abd523ea3d49c6282b0ce5dec1a160ccf2b93dc4e52b0a21b4a4ae58169  /tmp/v111-patches/standard.zst' | sha256sum -c -
          echo '4d261213d65a192f710c1fe05b90e357781eb38a94f27ad48a4d2a1d035a28bc  /tmp/v111-patches/legacy.zst' | sha256sum -c -
          zstd -d --patch-from=unsigned/RyusGua-v1.1.1-standard-unsigned-aligned.apk /tmp/v111-patches/standard.zst -o dist/RyusGua-v1.1.1-standard.apk
          zstd -d --patch-from=unsigned/RyusGua-v1.1.1-legacy-unsigned-aligned.apk /tmp/v111-patches/legacy.zst -o dist/RyusGua-v1.1.1-legacy.apk
          echo 'dd64de1c9cf78a30359441befa5a98fedb299451e8b9b3abaf26ed61ea0ef0d2  dist/RyusGua-v1.1.1-standard.apk' | sha256sum -c -
          echo 'df81a1af7f67b0fad9cdb4581c61870d7cdde16d572068cda201a5dc9064dbf9  dist/RyusGua-v1.1.1-legacy.apk' | sha256sum -c -
          java -jar unsigned/apksigner.jar verify --verbose --print-certs dist/RyusGua-v1.1.1-standard.apk | tee dist/signing-certificate.txt
          java -jar unsigned/apksigner.jar verify --verbose --print-certs dist/RyusGua-v1.1.1-legacy.apk > /tmp/legacy-cert.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d' dist/signing-certificate.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d' /tmp/legacy-cert.txt
          diff -u <(grep 'Signer #1 certificate SHA-256 digest' dist/signing-certificate.txt) <(grep 'Signer #1 certificate SHA-256 digest' /tmp/legacy-cert.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.1-final-signed-apks
          path: dist/*
          retention-days: 30

  legacy-startup:
    if: github.head_ref == 'v1.1.1-publish'
    needs: reconstruct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.1-final-signed-apks
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            until adb shell pm list packages >/dev/null 2>&1; do sleep 5; done
            adb install -r dist/RyusGua-v1.1.1-legacy.apk
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 4
            adb shell ps | grep -q 'com.ryusgua.app'

  standard-startup:
    if: github.head_ref == 'v1.1.1-publish'
    needs: reconstruct
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.1-final-signed-apks
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            until adb shell pm list packages >/dev/null 2>&1; do sleep 3; done
            adb install -r dist/RyusGua-v1.1.1-standard.apk
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -n com.ryusgua.app/.MainActivity || true
            ok=0
            for i in $(seq 1 30); do
              pid=$(adb shell pidof com.ryusgua.app 2>/dev/null | tr -d '\r' || true)
              focus=$(adb shell dumpsys window windows 2>/dev/null | grep -E 'mCurrentFocus|mFocusedApp' | grep 'com.ryusgua.app/.MainActivity' || true)
              if [ -n "$pid" ] && [ -n "$focus" ]; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              adb logcat -d | tail -n 400 || true
              adb shell dumpsys activity activities | grep -A 8 -B 4 com.ryusgua.app || true
              exit 1
            fi

  publish:
    if: github.head_ref == 'v1.1.1-publish'
    needs: [reconstruct, legacy-startup, standard-startup]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 2604674107093ce3c08a73846bb7427742cf49e2
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.1-final-signed-apks
          path: dist
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v111-source && mkdir -p /tmp/v111-source
          (cd source && git archive HEAD) | tar -x -C /tmp/v111-source
          (cd /tmp/v111-source && zip -qr "$GITHUB_WORKSPACE/dist/Ryus-Gua-v1.1.1-source.zip" .)
          unzip -t dist/Ryus-Gua-v1.1.1-source.zip >/dev/null
          (cd dist && sha256sum RyusGua-v1.1.1-standard.apk RyusGua-v1.1.1-legacy.apk Ryus-Gua-v1.1.1-source.zip signing-certificate.txt > sha256-release.txt)
      - name: Publish bilingual v1.1.1 release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 中文

          **柳之卦 · Ryu's Gua v1.1.1 维护更新**

          - 所有起卦页面统一使用手动正式起卦的底部安全布局，红色状态提示不再与爻象重叠。
          - 普通起卦与正式起卦均新增与历史页一致的右上角「返回」按钮。
          - 返回按钮与系统返回键都会安全取消当前起卦并回到主页。
          - 经典铜钱动画新增取消守卫，退出起卦后不会继续后台落爻。
          - Standard：Android 8.0+（API 26+）；Legacy：Android 6.0+（API 23+）。
          - 包名仍为 `com.ryusgua.app`，沿用 v1.0/v1.1 同一长期签名，可直接覆盖升级。

          ## English

          **Ryu's Gua v1.1.1 maintenance release**

          - Unified all casting screens to the safer manual Formal Casting bottom layout so red status text no longer overlaps the hexagram stack.
          - Added the same top-right Back control used by History to both normal and Formal Casting.
          - The UI Back control and system Back both safely cancel the current cast and return home.
          - Classic coin animation now stops cleanly after cancellation instead of settling another line in the background.
          - Standard: Android 8.0+ (API 26+); Legacy: Android 6.0+ (API 23+).
          - Package remains `com.ryusgua.app` and reuses the same long-term v1 signing certificate for in-place upgrades.
          EOF
          gh release delete v1.1.1 --repo Ryyus/Ryus-Gua --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.1.1 --repo Ryyus/Ryus-Gua \
            --target "$SOURCE_SHA" \
            --title "柳之卦 · Ryu's Gua v1.1.1" \
            --notes-file /tmp/release-notes.md \
            dist/RyusGua-v1.1.1-standard.apk \
            dist/RyusGua-v1.1.1-legacy.apk \
            dist/Ryus-Gua-v1.1.1-source.zip \
            dist/signing-certificate.txt \
            dist/sha256-release.txt
      - name: Re-download public release and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v111-public && mkdir -p /tmp/v111-public
          gh release download v1.1.1 --repo Ryyus/Ryus-Gua -D /tmp/v111-public
          (cd /tmp/v111-public && sha256sum -c sha256-release.txt)
