name: Apply v1.0 formal identity

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  transform:
    if: github.head_ref == 'v1.0.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0-dev
          fetch-depth: 0
      - name: Transform to v1.0 identity
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "applicationId 'com.ryusgua.app'" app/build.gradle && grep -q "versionName '1.0.0'" app/build.gradle; then
            echo 'v1.0 transformation already applied'
            exit 0
          fi
          python3 tools/v100_transform.py
          grep -q "namespace 'com.ryusgua.app'" app/build.gradle
          grep -q "applicationId 'com.ryusgua.app'" app/build.gradle
          grep -q "versionCode 100" app/build.gradle
          grep -q "versionName '1.0.0'" app/build.gradle
          test -f app/src/main/java/com/ryusgua/app/MainActivity.java
          test ! -d app/src/main/java/com/zhanggua/app
          ! grep -R -n -E 'com\.zhanggua\.app|掌卦|掌挂|ZhangGua|zhanggua' app README.md settings.gradle
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Establish Ryu’s Gua 1.0 Android identity'
          git push origin HEAD:v1.0.0-dev
