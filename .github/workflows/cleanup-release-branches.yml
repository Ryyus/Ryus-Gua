name: Cleanup completed release branches

on:
  push:
    branches: ["main"]
    paths: [".cleanup-release-branches-trigger"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove completed temporary branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in v0.9-dev v0.9.1-dev v0.9.2-dev v0.9.3-dev v0.9.3-publish; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Self-clean workflow and trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/cleanup-release-branches.yml .cleanup-release-branches-trigger
          git commit -m 'Clean completed release branches and temporary cleanup workflow'
          git push origin HEAD:main
