name: Apply homepage Formal Casting PR

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".home-formal-trigger"
      - "tools/move_formal_home.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v1.1.0-home-formal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0-home-formal
          fetch-depth: 0
      - name: Apply homepage move
        run: |
          set -euo pipefail
          python3 tools/move_formal_home.py
          rm -f .home-formal-trigger tools/move_formal_home.py .github/workflows/apply-home-formal-v110.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move Formal Casting to home screen"
          git push origin HEAD:v1.1.0-home-formal
