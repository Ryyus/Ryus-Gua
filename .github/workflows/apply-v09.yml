name: Apply v0.9 source patch

on:
  push:
    branches: ["main"]
    paths: [".v09-apply-trigger"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.9 branch
        uses: actions/checkout@v4
        with:
          ref: v0.9-dev
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .v09.patch.xz.b64 | xz -d > /tmp/v09.patch
          patch -p1 < /tmp/v09.patch
          rm .v09.patch.xz.b64
          grep -q "versionCode 9" app/build.gradle
          grep -q "versionName '0.9.0'" app/build.gradle
          grep -q 'ai_settings_v2' app/src/main/java/com/zhanggua/app/AiSettingsStore.java
          grep -q 'interpretStream' app/src/main/java/com/zhanggua/app/AiClient.java
          grep -q '流式输出' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'Ryus-Gua/main/update/latest.json' app/src/main/java/com/zhanggua/app/UpdateChecker.java

      - name: Commit v0.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement v0.9 AI settings and streaming fixes'
          git push origin HEAD:v0.9-dev
