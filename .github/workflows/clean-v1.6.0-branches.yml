name: Clean v1.6.0 release branches

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/clean-v1.6.0-branches.yml"]

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete release branches and self-clean
        run: |
          git push origin --delete codex/v1.6.0 codex/v1.6.0-publish codex/v160-test-apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/clean-v1.6.0-branches.yml
          git commit -m "Clean v1.6.0 release branches"
          git push origin HEAD:main
