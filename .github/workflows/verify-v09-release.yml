name: Verify v0.9 release asset

on:
  push:
    branches: ["main"]
    paths: [".v09-verify-trigger"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify public release APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v09
          gh release download v0.9.0 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.9-release.apk' --dir /tmp/v09
          SHA=$(sha256sum /tmp/v09/ZhangGua-v0.9-release.apk | awk '{print $1}')
          test "$SHA" = '21a0b9635af8de693073d9905faca9e8b57e9bebc77efb19825cf55bf723c444'
          printf 'v0.9.0 release verified\nAPK SHA-256: %s\n' "$SHA" > V0.9_RELEASE_VERIFIED
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add V0.9_RELEASE_VERIFIED
          git commit -m 'Verify v0.9 release asset'
          git push origin main
