name: Build v1.1.2 unsigned release

on:
  pull_request:
    branches: ["main"]
    paths: ["v112-build-trigger.txt"]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'v1.1.2-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.2-artifact
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify unsigned Release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleStandardRelease assembleLegacyRelease --no-daemon
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk dist/RyusGua-v1.1.2-standard-unsigned-aligned.apk
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/legacy/release/app-legacy-release-unsigned.apk dist/RyusGua-v1.1.2-legacy-unsigned-aligned.apk
          "$BT/zipalign" -c -v 4 dist/RyusGua-v1.1.2-standard-unsigned-aligned.apk
          "$BT/zipalign" -c -v 4 dist/RyusGua-v1.1.2-legacy-unsigned-aligned.apk
          "$BT/aapt" dump badging dist/RyusGua-v1.1.2-standard-unsigned-aligned.apk | tee dist/standard-badging.txt
          "$BT/aapt" dump badging dist/RyusGua-v1.1.2-legacy-unsigned-aligned.apk | tee dist/legacy-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='112' versionName='1.1.2'" dist/standard-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='112' versionName='1.1.2'" dist/legacy-badging.txt
          grep -q "sdkVersion:'26'" dist/standard-badging.txt
          grep -q "sdkVersion:'23'" dist/legacy-badging.txt
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/*.apk > dist/sha256-unsigned.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.2-unsigned-release-candidate
          path: dist/*
          retention-days: 30
