name: Cleanup v1.3.0 temporary branches

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-v130-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete completed v1.3.0 branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "v1.3.0-artifact"
            "v1.3.0-dev"
            "v1.3.0-final"
            "v1.3.0-go"
            "v1.3.0-mirror"
            "v1.3.0-publish"
            "v1.3.0-release"
            "v1.3.0-release-final"
            "v1.3.0-release-ready"
          )
          for b in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
              git push origin --delete "$b"
            fi
          done
