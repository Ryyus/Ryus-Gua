name: Publish v1.6.0

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/publish-v1.6.0.yml"]

permissions:
  contents: write

env:
  ASSET_DIR: release-assets/v1.6.0
  CERT_SHA256: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d

jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Decode signed APKs
        run: |
          base64 -d "$ASSET_DIR/RyusGua-v1.6.0-standard.apk.b64" > "$ASSET_DIR/RyusGua-v1.6.0-standard.apk"
          base64 -d "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk.b64" > "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk"
      - name: Verify hashes, signatures and manifest metadata
        run: |
          cd "$ASSET_DIR"
          sha256sum -c SHA256SUMS.txt
          for apk in RyusGua-v1.6.0-standard.apk RyusGua-v1.6.0-legacy.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$apk.verify"
            grep -F "Signer #1 certificate SHA-256 digest: $CERT_SHA256" "$apk.verify"
          done
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging RyusGua-v1.6.0-standard.apk | tee standard.badging
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging RyusGua-v1.6.0-legacy.apk | tee legacy.badging
          grep -F "package: name='com.ryusgua.app' versionCode='160' versionName='1.6.0'" standard.badging
          grep -F "package: name='com.ryusgua.app' versionCode='160' versionName='1.6.0'" legacy.badging
          grep -F "sdkVersion:'26'" standard.badging
          grep -F "sdkVersion:'23'" legacy.badging

  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            flavor: legacy
          - api: 35
            flavor: standard
    steps:
      - uses: actions/checkout@v4
      - name: Decode signed APK
        run: base64 -d "$ASSET_DIR/RyusGua-v1.6.0-${{ matrix.flavor }}.apk.b64" > "$RUNNER_TEMP/RyusGua.apk"
      - name: Install and launch on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r "$RUNNER_TEMP/RyusGua.apk"
            adb shell am force-stop com.ryusgua.app
            adb shell monkey -p com.ryusgua.app -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell ps | grep -F com.ryusgua.app
            if adb logcat -d AndroidRuntime:E '*:S' | grep -q 'FATAL EXCEPTION'; then
              adb logcat -d AndroidRuntime:E '*:S'
              exit 1
            fi

  publish:
    needs: [verify-assets, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode final assets
        run: |
          base64 -d "$ASSET_DIR/RyusGua-v1.6.0-standard.apk.b64" > "$ASSET_DIR/RyusGua-v1.6.0-standard.apk"
          base64 -d "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk.b64" > "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk"
          cd "$ASSET_DIR"
          sha256sum -c SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.0 \
            "$ASSET_DIR/RyusGua-v1.6.0-standard.apk" \
            "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk" \
            "$ASSET_DIR/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "柳之卦 v1.6.0 / Ryu's Gua 1.6.0" \
            --notes-file "$ASSET_DIR/RELEASE_NOTES.md"
      - name: Publish immutable update mirrors and clean temporary files
        run: |
          mkdir -p update/releases/v1.6.0
          cp "$ASSET_DIR/RyusGua-v1.6.0-standard.apk" update/releases/v1.6.0/
          cp "$ASSET_DIR/RyusGua-v1.6.0-legacy.apk" update/releases/v1.6.0/
          cp "$ASSET_DIR/SHA256SUMS.txt" update/releases/v1.6.0/
          git rm -r "$ASSET_DIR" .github/workflows/publish-v1.6.0.yml
          git add update/releases/v1.6.0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish v1.6.0 signed Android release"
          git push origin HEAD:main
