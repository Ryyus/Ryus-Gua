name: Archive Windows v1.0.0 release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "release-windows/archive-v100.txt"

permissions:
  contents: write

jobs:
  archive:
    if: github.head_ref == 'archive-windows-v100'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Convert public Windows v1.0.0 release to draft
        shell: bash
        run: |
          set -euo pipefail
          gh release edit windows-v1.0.0 --repo Ryyus/Ryus-Gua --draft
          gh release view windows-v1.0.0 --repo Ryyus/Ryus-Gua --json tagName,name,isDraft | tee /tmp/archive.json
          grep -q '"isDraft":true' /tmp/archive.json
