name: Apply v1.4.0 Liuyao UI patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_v140.py"
      - "tools/apply_v140_fix.py"
      - "tools/fix_v140_compile.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v1.4.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.0-dev
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.4.0 integration or compile fix
        run: |
          if [ -f tools/apply_v140_fix.py ] && [ -f tools/apply_v140.py ]; then
            python tools/apply_v140_fix.py
            python tools/apply_v140.py
            rm -f tools/apply_v140.py tools/apply_v140_fix.py
          fi
          if [ -f tools/fix_v140_compile.py ]; then
            python tools/fix_v140_compile.py
            rm -f tools/fix_v140_compile.py
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix v1.4.0 Liuyao integration"
          git push origin HEAD:v1.4.0-dev
