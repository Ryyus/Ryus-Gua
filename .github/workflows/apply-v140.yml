name: Apply v1.4.0 Liuyao UI patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_v140.py"
      - "tools/apply_v140_fix.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v1.4.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.0-dev
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.4.0 UI integration
        run: |
          python tools/apply_v140_fix.py
          python tools/apply_v140.py
          rm -f tools/apply_v140.py tools/apply_v140_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate local Liuyao board and knowledge UI"
          git push origin HEAD:v1.4.0-dev
