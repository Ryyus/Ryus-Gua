name: Fix v1.1 dynamic version source

on:
  push:
    branches: ["v1.1.0-dev"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0-dev
          fetch-depth: 0
      - name: Replace BuildConfig version lookup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/ryusgua/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          count = s.count('BuildConfig.VERSION_NAME')
          if count != 4:
              raise SystemExit(f'expected 4 BuildConfig.VERSION_NAME references, got {count}')
          s = s.replace('BuildConfig.VERSION_NAME', 'appVersion()')
          anchor = '''        private void startBootAnimation() {\n'''
          helper = '''        private String appVersion() {\n            try {\n                String version = getContext().getPackageManager()\n                        .getPackageInfo(getContext().getPackageName(), 0).versionName;\n                return version == null || version.trim().isEmpty() ? "—" : version;\n            } catch (Throwable ignored) {\n                return "—";\n            }\n        }\n\n'''
          if anchor not in s:
              raise SystemExit('startBootAnimation anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
          ! grep -q 'BuildConfig.VERSION_NAME' app/src/main/java/com/ryusgua/app/MainActivity.java
          grep -q 'getPackageInfo' app/src/main/java/com/ryusgua/app/MainActivity.java
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v110-version.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Read in-app version from installed package metadata'
          git push origin HEAD:v1.1.0-dev
