name: Build v1.1.1 unsigned release

on:
  pull_request:
    branches: ["main"]
    paths: [".v111-artifact"]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'v1.1.1-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1-artifact
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify unsigned Release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleStandardRelease assembleLegacyRelease
          mkdir -p dist
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk dist/RyusGua-v1.1.1-standard-unsigned-aligned.apk
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/legacy/release/app-legacy-release-unsigned.apk dist/RyusGua-v1.1.1-legacy-unsigned-aligned.apk
          "$ZIPALIGN" -c -v 4 dist/RyusGua-v1.1.1-standard-unsigned-aligned.apk
          "$ZIPALIGN" -c -v 4 dist/RyusGua-v1.1.1-legacy-unsigned-aligned.apk
          "$AAPT" dump badging dist/RyusGua-v1.1.1-standard-unsigned-aligned.apk | tee dist/standard-badging.txt
          "$AAPT" dump badging dist/RyusGua-v1.1.1-legacy-unsigned-aligned.apk | tee dist/legacy-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='111' versionName='1.1.1'" dist/standard-badging.txt
          grep -q "sdkVersion:'26'" dist/standard-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='111' versionName='1.1.1'" dist/legacy-badging.txt
          grep -q "sdkVersion:'23'" dist/legacy-badging.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          (cd dist && sha256sum RyusGua-v1.1.1-standard-unsigned-aligned.apk RyusGua-v1.1.1-legacy-unsigned-aligned.apk > unsigned-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.1-unsigned-release-candidate
          path: dist/*
          retention-days: 30
