name: Publish Ryu's Gua v0.9.3 verified release

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'v0.9.3-publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.3-publish
          fetch-depth: 0
      - name: Download and verify private signed bundle
        shell: bash
        env:
          STANDARD_SHA: 2305d48af0eb6c38e77b92dc9f34cda40e245dc6d2905797252f50c45f3f1bea
          LEGACY_SHA: d86b6ee4c4440d0d9ad6f765b01c53cfc6c3155eefbc0c9704b51ffb3957645f
        run: |
          set -euo pipefail
          URL=$(cat .v093-artifact-url)
          curl -L --fail --retry 3 "$URL" -o /tmp/v093-verified.zip
          mkdir -p dist
          unzip -q /tmp/v093-verified.zip -d dist
          test "$(sha256sum dist/ZhangGua-v0.9.3-release.apk | awk '{print $1}')" = "$STANDARD_SHA"
          test "$(sha256sum dist/ZhangGua-v0.9.3-legacy.apk | awk '{print $1}')" = "$LEGACY_SHA"
          unzip -t dist/ZhangGua-v0.9.3-release.apk >/dev/null
          unzip -t dist/ZhangGua-v0.9.3-legacy.apk >/dev/null
      - name: Prepare clean source archive
        shell: bash
        run: |
          set -euo pipefail
          cat > update/latest.json <<'JSON'
          {
            "versionCode": 12,
            "versionName": "0.9.3",
            "title": "掌卦 v0.9.3 可用",
            "notes": "动画时长统一；正式起卦自动返回主界面；预设 AI Endpoint 只读；历史新增 AI 存档、秒级时间、正式起卦标记、PIN 与备注；新增 Android 6.0+ Legacy APK。",
            "releasePage": "https://github.com/Ryyus/Ryus-Gua/releases/tag/v0.9.3",
            "apkUrl": "https://github.com/Ryyus/Ryus-Gua/releases/download/v0.9.3/ZhangGua-v0.9.3-release.apk",
            "legacyApkUrl": "https://github.com/Ryyus/Ryus-Gua/releases/download/v0.9.3/ZhangGua-v0.9.3-legacy.apk",
            "minSdk": 26,
            "legacyMinSdk": 23,
            "sha256": "2305d48af0eb6c38e77b92dc9f34cda40e245dc6d2905797252f50c45f3f1bea",
            "legacySha256": "d86b6ee4c4440d0d9ad6f765b01c53cfc6c3155eefbc0c9704b51ffb3957645f"
          }
          JSON
          rm -f dist/Ryus-Gua-v0.9.3-source.zip
          zip -qr dist/Ryus-Gua-v0.9.3-source.zip . \
            -x '.git/*' '.gradle/*' '*/build/*' 'local.properties' 'dist/*' '.v093-*' '.github/workflows/publish-v093.yml'
          unzip -t dist/Ryus-Gua-v0.9.3-source.zip >/dev/null
          sha256sum dist/ZhangGua-v0.9.3-release.apk dist/ZhangGua-v0.9.3-legacy.apk dist/Ryus-Gua-v0.9.3-source.zip | tee dist/sha256-release.txt
      - name: Create bilingual GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 中文

          **柳之卦 · Ryu's Gua v0.9.3 / 掌卦 v0.9.3**

          本次更新重点：
          - 经典浮动动画与物理飞出动画统一为约 **1.08 秒**，降低静态铜币翻转速度。
          - 从设置启动“正式起卦”后，自动关闭设置并返回主界面等待整分。
          - OpenAI / DeepSeek / Gemini / 通义千问 / Kimi 等预设服务商的 API 地址改为只读小字；仅“自定义”允许编辑 Endpoint。
          - AI 解卦结果会保存到对应历史；历史显示 `HH:mm:ss` 与“普通起卦 / 正式起卦”。
          - 历史支持 **PIN 固定**与**备注**；最近 30 条限制只统计未固定记录，固定记录不会自动删除。
          - 新增 **Legacy APK（Android 6.0+ / API 23+）**；标准 APK 继续面向 Android 8.0+ / API 26+。

          下载建议：
          - `ZhangGua-v0.9.3-release.apk`：Android 8.0 及以上（推荐）
          - `ZhangGua-v0.9.3-legacy.apk`：Android 6.0–7.x 或需要兼容包的设备

          ## English

          **Ryu's Gua v0.9.3 / 掌卦 v0.9.3**

          Highlights:
          - Matched the classic floating animation to the ~**1.08 s** physics-launch animation, reducing the overly fast static coin flip.
          - Starting Formal Casting from Settings now closes Settings and returns to the main screen before the whole-minute schedule begins.
          - Preset AI providers now show their API endpoint as read-only small text; only Custom allows endpoint editing.
          - AI interpretations are persisted with their history entry. History now records `HH:mm:ss` and whether the cast was normal or Formal Casting.
          - History supports **pinning** and **notes**. The 30-entry rolling limit applies only to unpinned entries; pinned entries are never automatically deleted.
          - Added a **Legacy APK for Android 6.0+ (API 23+)**; the Standard APK remains optimized for Android 8.0+ (API 26+).

          Downloads:
          - `ZhangGua-v0.9.3-release.apk`: Android 8.0+ (recommended)
          - `ZhangGua-v0.9.3-legacy.apk`: Android 6.0–7.x / compatibility build

          ### Reference / 参考
          This remains an independent Android reconstruction. See `docs/REFERENCES.md` for eXphinx, the related web implementation, and `Johnson-Jia/liuyao-divination` attribution.
          本项目仍为独立 Android 重构，完整参考与许可信息见 `docs/REFERENCES.md` 与 `THIRD_PARTY_NOTICES.md`。
          EOF
          gh release delete v0.9.3 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.9.3 \
            --target 4429ee43d1cbf663d074bd1f08b153b8bcdda6e1 \
            --title "柳之卦 · Ryu's Gua v0.9.3 / 掌卦 v0.9.3" \
            --notes-file /tmp/release-notes.md \
            dist/ZhangGua-v0.9.3-release.apk \
            dist/ZhangGua-v0.9.3-legacy.apk \
            dist/Ryus-Gua-v0.9.3-source.zip \
            dist/sha256-release.txt
      - name: Re-download public assets and verify hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STANDARD_SHA: 2305d48af0eb6c38e77b92dc9f34cda40e245dc6d2905797252f50c45f3f1bea
          LEGACY_SHA: d86b6ee4c4440d0d9ad6f765b01c53cfc6c3155eefbc0c9704b51ffb3957645f
        run: |
          set -euo pipefail
          rm -rf /tmp/v093-public && mkdir -p /tmp/v093-public
          gh release download v0.9.3 -D /tmp/v093-public -p 'ZhangGua-v0.9.3-release.apk' -p 'ZhangGua-v0.9.3-legacy.apk'
          test "$(sha256sum /tmp/v093-public/ZhangGua-v0.9.3-release.apk | awk '{print $1}')" = "$STANDARD_SHA"
          test "$(sha256sum /tmp/v093-public/ZhangGua-v0.9.3-legacy.apk | awk '{print $1}')" = "$LEGACY_SHA"
