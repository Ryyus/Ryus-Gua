name: Build v1.1.0 final unsigned artifact

on:
  pull_request:
    branches: ["main"]
    paths: [".v110-final-artifact"]

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'v1.1.0-final-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0-final-artifact
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and align unsigned Release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleStandardRelease assembleLegacyRelease
          mkdir -p dist
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk dist/RyusGua-v1.1.0-standard-unsigned-aligned.apk
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/legacy/release/app-legacy-release-unsigned.apk dist/RyusGua-v1.1.0-legacy-unsigned-aligned.apk
          "$ZIPALIGN" -c -v 4 dist/RyusGua-v1.1.0-standard-unsigned-aligned.apk
          "$ZIPALIGN" -c -v 4 dist/RyusGua-v1.1.0-legacy-unsigned-aligned.apk
          "$AAPT" dump badging dist/RyusGua-v1.1.0-standard-unsigned-aligned.apk | tee dist/standard-badging.txt
          "$AAPT" dump badging dist/RyusGua-v1.1.0-legacy-unsigned-aligned.apk | tee dist/legacy-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='110' versionName='1.1.0'" dist/standard-badging.txt
          grep -q "sdkVersion:'26'" dist/standard-badging.txt
          grep -q "package: name='com.ryusgua.app' versionCode='110' versionName='1.1.0'" dist/legacy-badging.txt
          grep -q "sdkVersion:'23'" dist/legacy-badging.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
      - name: Create clean source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v110-source && mkdir -p /tmp/v110-source
          git archive HEAD | tar -x -C /tmp/v110-source
          rm -f /tmp/v110-source/.v110-final-artifact
          rm -f /tmp/v110-source/.github/workflows/build-v110-final-artifact.yml
          (cd /tmp/v110-source && zip -qr "$GITHUB_WORKSPACE/dist/Ryus-Gua-v1.1.0-source.zip" .)
          unzip -t dist/Ryus-Gua-v1.1.0-source.zip >/dev/null
          (cd dist && sha256sum RyusGua-v1.1.0-standard-unsigned-aligned.apk RyusGua-v1.1.0-legacy-unsigned-aligned.apk Ryus-Gua-v1.1.0-source.zip > unsigned-sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.0-final-unsigned-release-candidate
          path: dist/*
          retention-days: 30
