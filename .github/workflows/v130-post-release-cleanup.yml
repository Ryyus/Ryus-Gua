name: v1.3.0 post-release cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/v130-post-release-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Refresh README and clean temporary branches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('**正式版 / Stable release: 1.2.0**', '**正式版 / Stable release: 1.3.0**')
          cn = '''### 1.3.0 交互更新\n\n- 设置页统一为现代深色卡片与开关，开屏进度改为独立设置项。\n- 新安装默认开启音效反馈、动效呈现和垂直翻转；触感、摇动与手动逐爻默认关闭。\n- 正式起卦加入五分钟节制：取消不计入；五分钟内完成两次普通起卦时也会暂缓正式起卦。\n- 更新检查改为 jsDelivr 国内优先、GitHub 兜底，并提供 Standard / Legacy 对应的版本镜像。\n- 版本号提升至 **1.3.0 / versionCode 130**。\n\n'''
          marker = '### 1.2.0 视觉更新\n'
          if cn not in s and marker in s:
              s = s.replace(marker, cn + marker, 1)
          en = '''### What's new in 1.3.0\n\n- Modernized Settings with dark cards and switch controls, including a dedicated boot-progress toggle.\n- Fresh installs enable sound, animation, and vertical flip by default.\n- Added a five-minute Formal Casting guard; cancelled casts do not count, and two completed normal casts within five minutes also pause Formal Casting.\n- Added a jsDelivr-first update path with GitHub fallback and flavor-specific Standard / Legacy mirrors.\n- Version bumped to **1.3.0 / versionCode 130**.\n\n'''
          marker2 = "### What's new in 1.2.0\n"
          if en not in s and marker2 in s:
              s = s.replace(marker2, en + marker2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/v130-post-release-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/v130-post-release-cleanup.yml
          if ! git diff --cached --quiet; then
            git commit -m "Finalize v1.3.0 release documentation"
            git push origin HEAD:main
          fi
          for branch in v1.3.0-dev v1.3.0-artifact v1.3.0-mirror; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
