name: Apply v0.9.3 source patch

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v0.9.3-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.3-dev
          fetch-depth: 0
      - name: Apply exact v0.9.3 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "versionCode 12" app/build.gradle && grep -q 'clearUnpinned' app/src/main/java/com/zhanggua/app/HistoryStore.java; then
            echo 'v0.9.3 patch already applied'
            exit 0
          fi
          git fetch origin main
          for p in 00 01 02 03 04; do
            git show "origin/main:.v093-patch-part-$p"
          done | base64 -d | gzip -d > /tmp/v093.patch
          patch -p1 < /tmp/v093.patch || true
          git show origin/main:.v093-README.md > README.md
          rm -f README.md.rej
          grep -q "versionCode 12" app/build.gradle
          grep -q "versionName '0.9.3'" app/build.gradle
          grep -q "standard" app/build.gradle
          grep -q "legacy" app/build.gradle
          grep -q "minSdk 23" app/build.gradle
          grep -q '1080f' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'clearUnpinned' app/src/main/java/com/zhanggua/app/HistoryStore.java
          grep -q 'updateAi' app/src/main/java/com/zhanggua/app/HistoryStore.java
          grep -q 'togglePin' app/src/main/java/com/zhanggua/app/HistoryStore.java
          grep -q 'API 地址 ·' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'Api26Vibration' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'Android 6.0+' README.md
          test -s app/src/main/res/mipmap-anydpi/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi/ic_launcher_round.xml
          test -s app/src/main/res/values-v27/themes.xml
          git rm -f .v093-branch-only 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app README.md CHANGELOG.md
          git commit -m 'Implement v0.9.3 history, AI settings, animation, and legacy build'
          git push origin HEAD:v0.9.3-dev
