name: Publish verified Ryu's Gua v1.1.0

on:
  pull_request:
    branches: ["main"]
    paths: ["release-transfer/**"]

permissions:
  contents: write
  actions: read

jobs:
  reconstruct:
    if: github.head_ref == 'v1.1.0-publish-final'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.0-publish-final
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download verified unsigned release candidate
        uses: actions/download-artifact@v4
        with:
          name: v1.1.0-final-unsigned-release-candidate
          path: unsigned
          github-token: ${{ github.token }}
          run-id: 32376491762
      - name: Reconstruct and verify formally signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          echo 'a1f2e7928dca5794c7c6218f6901a31b23a3276b9b7347cecfa28f92195b9df6  release-transfer/v1.1.0-standard-sign.patch.zst' | sha256sum -c -
          echo 'e89cfb8cb96308b537d95847a5fadcfdfe287ccd0ace8c3a04ebe046136083e9  release-transfer/v1.1.0-legacy-sign.patch.zst' | sha256sum -c -
          zstd -d --patch-from=unsigned/RyusGua-v1.1.0-standard-unsigned-aligned.apk release-transfer/v1.1.0-standard-sign.patch.zst -o dist/RyusGua-v1.1.0-standard.apk
          zstd -d --patch-from=unsigned/RyusGua-v1.1.0-legacy-unsigned-aligned.apk release-transfer/v1.1.0-legacy-sign.patch.zst -o dist/RyusGua-v1.1.0-legacy.apk
          echo '9f880ea384558ba3c6d179be56ec60cea75c487452b19b769899d07216807ff9  dist/RyusGua-v1.1.0-standard.apk' | sha256sum -c -
          echo 'dda0eb234b2d0cfd2a6573b8c4d79d718bc673a84948ff1bd3002dccc5b8a3dc  dist/RyusGua-v1.1.0-legacy.apk' | sha256sum -c -
          java -jar unsigned/apksigner.jar verify --verbose --print-certs dist/RyusGua-v1.1.0-standard.apk | tee dist/signing-certificate.txt
          java -jar unsigned/apksigner.jar verify --verbose --print-certs dist/RyusGua-v1.1.0-legacy.apk > /tmp/legacy-cert.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d' dist/signing-certificate.txt
          grep -q 'Signer #1 certificate SHA-256 digest: 14b5ac4ba6814aa62ee254b7a7f6454707350f32cc695f8f240d2f28250f8c5d' /tmp/legacy-cert.txt
          diff -u <(grep 'Signer #1 certificate SHA-256 digest' dist/signing-certificate.txt) <(grep 'Signer #1 certificate SHA-256 digest' /tmp/legacy-cert.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.1.0-final-signed-apks
          path: dist/*
          retention-days: 30

  legacy-startup:
    if: github.head_ref == 'v1.1.0-publish-final'
    needs: reconstruct
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.0-final-signed-apks
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            until adb shell pm list packages >/dev/null 2>&1; do sleep 5; done
            adb install -r dist/RyusGua-v1.1.0-legacy.apk
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 4
            adb shell ps | grep -q 'com.ryusgua.app'

  standard-startup:
    if: github.head_ref == 'v1.1.0-publish-final'
    needs: reconstruct
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.0-final-signed-apks
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            until adb shell pm list packages >/dev/null 2>&1; do sleep 3; done
            adb install -r dist/RyusGua-v1.1.0-standard.apk
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -n com.ryusgua.app/.MainActivity
            sleep 15
            test -n "$(adb shell pidof com.ryusgua.app | tr -d '\r')"
            adb shell dumpsys activity activities | tee /tmp/activities.txt
            grep -Eq 'topResumedActivity.*com\.ryusgua\.app/.MainActivity|mResumedActivity.*com\.ryusgua\.app/.MainActivity|mFocusedApp.*com\.ryusgua\.app' /tmp/activities.txt

  publish:
    if: github.head_ref == 'v1.1.0-publish-final'
    needs: [reconstruct, legacy-startup, standard-startup]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 31d0e22c773c0d27dc890ef2348c6cf193ff7e91
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.1.0-final-signed-apks
          path: dist
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          fetch-depth: 0
      - name: Create source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v110-source && mkdir -p /tmp/v110-source
          (cd source && git archive HEAD) | tar -x -C /tmp/v110-source
          (cd /tmp/v110-source && zip -qr "$GITHUB_WORKSPACE/dist/Ryus-Gua-v1.1.0-source.zip" .)
          unzip -t dist/Ryus-Gua-v1.1.0-source.zip >/dev/null
          (cd dist && sha256sum RyusGua-v1.1.0-standard.apk RyusGua-v1.1.0-legacy.apk Ryus-Gua-v1.1.0-source.zip signing-certificate.txt > sha256-release.txt)
      - name: Publish bilingual v1.1.0 release
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 中文

          **柳之卦 · Ryu's Gua v1.1.0 正式版**

          - 新增完全离线解卦：点击「解卦」先查看本机规则结果，无需网络、账号或 API Key。
          - 离线结果基于本卦、之卦、上下卦象意与 0–6 动爻取用规则动态生成。
          - AI 解卦改为离线结果页中的可选增强步骤，并以本机已计算结果为依据。
          - **正式起卦已移至主页**，与普通起卦独立显示；设置页不再重复放置正式起卦入口。
          - 修复应用内旧版本号显示，版本信息统一读取实际安装包版本。
          - Standard：Android 8.0+（API 26+）；Legacy：Android 6.0+（API 23+）。
          - 包名继续为 `com.ryusgua.app`，并沿用 v1.0.0 同一长期签名证书，可从 v1.0.0 正常覆盖升级。

          本次发布前已完成 Public CI、正式签名一致性校验、Android 6 / API 23 启动测试、Android 35 / API 35 启动测试与公开资产 SHA-256 校验。

          ## English

          **Ryu's Gua v1.1.0 stable release**

          - Added fully offline deterministic readings. Reading works without a network, account, API key, or cloud model.
          - Offline interpretation derives from the base/changed hexagrams, trigram symbolism, and 0–6 moving-line selection rules.
          - AI interpretation is now an optional second step launched from the offline result page and grounded in the locally computed reading.
          - **Formal Casting now has a dedicated home-screen entry**, separate from normal casting; the duplicate Settings entry has been removed.
          - Fixed stale in-app version labels by reading the installed package version.
          - Standard: Android 8.0+ (API 26+); Legacy: Android 6.0+ (API 23+).
          - Package remains `com.ryusgua.app` and uses the same long-term signing certificate as v1.0.0, allowing an in-place upgrade from v1.0.0.

          Before publication, this release passed public CI, release-signature consistency checks, Android 6/API 23 startup validation, Android 35/API 35 startup validation, and SHA-256 verification of public assets.

          ### Reference / 参考
          This remains an independent Android reconstruction. See `docs/REFERENCES.md` and `THIRD_PARTY_NOTICES.md` for references and attribution.
          EOF
          gh release delete v1.1.0 --repo Ryyus/Ryus-Gua --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.1.0 --repo Ryyus/Ryus-Gua \
            --target "$SOURCE_SHA" \
            --title "柳之卦 · Ryu's Gua v1.1.0" \
            --notes-file /tmp/release-notes.md \
            dist/RyusGua-v1.1.0-standard.apk \
            dist/RyusGua-v1.1.0-legacy.apk \
            dist/Ryus-Gua-v1.1.0-source.zip \
            dist/signing-certificate.txt \
            dist/sha256-release.txt
      - name: Re-download public release and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v110-public && mkdir -p /tmp/v110-public
          gh release download v1.1.0 --repo Ryyus/Ryus-Gua -D /tmp/v110-public
          (cd /tmp/v110-public && sha256sum -c sha256-release.txt)
