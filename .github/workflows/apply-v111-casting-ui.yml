name: Apply v1.1.1 casting UI patch

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".v111-trigger"
      - "tools/v111_casting_ui_patch.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v1.1.1-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.1-dev
          fetch-depth: 0
      - name: Apply casting UI fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v111_casting_ui_patch.py
          rm -f .v111-trigger tools/v111_casting_ui_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix casting status layout and back navigation"
          git push origin HEAD:v1.1.1-dev
