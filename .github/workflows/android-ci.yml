name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Build unsigned release APKs
        run: gradle assembleStandardRelease assembleLegacyRelease
      - name: Align release APKs
        run: |
          mkdir -p unsigned-release
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk unsigned-release/RyusGua-v1.6.0-standard-unsigned-aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 app/build/outputs/apk/legacy/release/app-legacy-release-unsigned.apk unsigned-release/RyusGua-v1.6.0-legacy-unsigned-aligned.apk
      - name: Upload unsigned aligned release APKs
        uses: actions/upload-artifact@v4
        with:
          name: RyusGua-v1.6.0-unsigned-aligned-release
          path: unsigned-release/*.apk
          if-no-files-found: error
