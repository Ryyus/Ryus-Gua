name: Publish Ryu's Gua v1.0.0 verified release

on:
  pull_request:
    branches: ["main"]
    paths: [".v100-release-trigger"]

permissions:
  contents: write

jobs:
  build-sign:
    if: github.head_ref == 'v1.0.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0-dev
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate v1 signing identity, build and verify signed APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ryus-signing dist
          STORE_PASS="$(openssl rand -base64 36 | tr -d '\n')"
          KEY_ALIAS="ryusgua-v1"
          keytool -genkeypair \
            -keystore /tmp/ryus-signing/ryus-gua-v1-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Ryu's Gua Release, OU=Android, O=Ryyus"
          cat > /tmp/ryus-signing/credentials.txt <<EOF
          ZG_STORE_PASSWORD=$STORE_PASS
          ZG_KEY_ALIAS=$KEY_ALIAS
          ZG_KEY_PASSWORD=$STORE_PASS
          EOF
          gradle assembleStandardRelease assembleLegacyRelease \
            -PZG_STORE_FILE=/tmp/ryus-signing/ryus-gua-v1-release.jks \
            -PZG_STORE_PASSWORD="$STORE_PASS" \
            -PZG_KEY_ALIAS="$KEY_ALIAS" \
            -PZG_KEY_PASSWORD="$STORE_PASS"
          cp app/build/outputs/apk/standard/release/app-standard-release.apk dist/RyusGua-v1.0.0-standard.apk
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk dist/RyusGua-v1.0.0-legacy.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs dist/RyusGua-v1.0.0-standard.apk | tee dist/signing-certificate.txt
          "$APKSIGNER" verify --verbose --print-certs dist/RyusGua-v1.0.0-legacy.apk >/tmp/legacy-cert.txt
          grep -q "com.ryusgua.app" <("$AAPT" dump badging dist/RyusGua-v1.0.0-standard.apk)
          grep -q "versionCode='100'" <("$AAPT" dump badging dist/RyusGua-v1.0.0-standard.apk)
          grep -q "versionName='1.0.0'" <("$AAPT" dump badging dist/RyusGua-v1.0.0-standard.apk)
          grep -q "sdkVersion:'26'" <("$AAPT" dump badging dist/RyusGua-v1.0.0-standard.apk)
          grep -q "com.ryusgua.app" <("$AAPT" dump badging dist/RyusGua-v1.0.0-legacy.apk)
          grep -q "sdkVersion:'23'" <("$AAPT" dump badging dist/RyusGua-v1.0.0-legacy.apk)
          diff -u <(grep 'Signer #1 certificate SHA-256 digest' dist/signing-certificate.txt) <(grep 'Signer #1 certificate SHA-256 digest' /tmp/legacy-cert.txt)
      - name: Create clean source archive and encrypted signing backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v100-source
          git archive HEAD | tar -x -C /tmp/v100-source
          rm -f /tmp/v100-source/.v100-release-trigger
          rm -f /tmp/v100-source/.github/workflows/publish-v100.yml
          (cd /tmp/v100-source && zip -qr "$GITHUB_WORKSPACE/dist/Ryus-Gua-v1.0.0-source.zip" .)
          unzip -t dist/Ryus-Gua-v1.0.0-source.zip >/dev/null
          cat > /tmp/recovery-public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA44Cgkl0eKHbxcdfHfPje
          STjtUFN58UHPhXeL/QUVX+pZFiv5RAnJq+/tQQwBaprTpY55ciXMz65fRPoFyBk9
          UJiRx7bKiqpQaRoBeyBeikgUreqxHvF7YJtALt+7u7ZoASZfmmWX4oqEZ5ZCSi0e
          UmAjhduYk6jsUssLo2ZAhf68bHuC3RQ9pXw2/0Vkakusu0/DmSeo06q3qmThzZFM
          K0KoAEkXtYH1MYvnJfQmRFwxuCYAF4NEegUUMpo0DSVgmfEguy3T4SczkSO+MVnI
          KnwbjFOiPus8PUnAkeNcy6WoFEOw8UF/ZpVwIz+8peEbbORih9d2CgKNU2vHja+g
          uzivckIznBk/tjtFbPuiHHpp7bD5t93T6STYSneZxCRdBUq+Qn8HTmp0X7vRXASV
          eP3NfDM/1du3V+qLFmROL3o+e8jKm0xVOaFnMaP9Lxs3+rTxcgvUHlA1Nmrzyx8o
          c0Le7Of6Q2oJSttR4sNOSNyo8jdrLS/ppvw1uXf+Su5j7HRCCw0F5cHr4MXl6afS
          +TU4Dw2bdyRGOkuRfWRStWSOJrEnKDGhUBNbyQ2DVPwTRPaikozgsZpyIS7aY3i4
          BJd+U4R9xSCfB3vX3yitF6Z2a/L74h3RqH0BKj9vpdS1294l7Llo/fXef2UeBXkt
          w2cpYoCWe2CK0s1PsSBsV9kCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          tar -C /tmp/ryus-signing -czf /tmp/ryus-gua-v1-signing-backup.tar.gz ryus-gua-v1-release.jks credentials.txt
          RECOVERY_SECRET="$(openssl rand -hex 32)"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in /tmp/ryus-gua-v1-signing-backup.tar.gz \
            -out /tmp/ryus-gua-v1-signing-backup.enc \
            -pass pass:"$RECOVERY_SECRET"
          printf '%s' "$RECOVERY_SECRET" | openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/recovery-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out /tmp/ryus-gua-v1-signing-backup-key.enc
          cat > /tmp/RECOVERY.txt <<'EOF'
          Ryu's Gua v1 signing backup

          This archive contains only encrypted signing material.
          Keep the separately supplied ryus-gua-v1-recovery-private.pem offline.

          Recovery outline:
          1. Unzip this archive.
          2. Decrypt signing-backup-key.enc with the RSA recovery private key using OAEP/SHA-256.
          3. Use the recovered secret to decrypt signing-backup.enc with AES-256-CBC + PBKDF2, 200000 iterations.
          4. Extract the resulting tar.gz to recover the JKS and credentials.txt.
          EOF
          mkdir -p /tmp/encrypted-backup
          cp /tmp/ryus-gua-v1-signing-backup.enc /tmp/encrypted-backup/signing-backup.enc
          cp /tmp/ryus-gua-v1-signing-backup-key.enc /tmp/encrypted-backup/signing-backup-key.enc
          cp /tmp/recovery-public.pem /tmp/encrypted-backup/recovery-public.pem
          cp /tmp/RECOVERY.txt /tmp/encrypted-backup/RECOVERY.txt
          (cd /tmp/encrypted-backup && zip -qr "$GITHUB_WORKSPACE/dist/RyusGua-v1.0.0-signing-backup-encrypted.zip" .)
          rm -rf /tmp/ryus-signing /tmp/ryus-gua-v1-signing-backup.tar.gz /tmp/ryus-gua-v1-signing-backup.enc /tmp/ryus-gua-v1-signing-backup-key.enc
          (cd dist && sha256sum RyusGua-v1.0.0-standard.apk RyusGua-v1.0.0-legacy.apk Ryus-Gua-v1.0.0-source.zip RyusGua-v1.0.0-signing-backup-encrypted.zip signing-certificate.txt > sha256-release.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: v1.0.0-release-candidate
          path: dist/*
          retention-days: 30

  startup-test:
    if: github.head_ref == 'v1.0.0-dev'
    needs: build-sign
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            apk: RyusGua-v1.0.0-standard.apk
          - api: 23
            apk: RyusGua-v1.0.0-legacy.apk
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.0.0-release-candidate
          path: dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -e
            adb install -r "dist/${{ matrix.apk }}"
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q "Status: ok" /tmp/start.txt
            sleep 4
            adb shell ps | grep -q "com.ryusgua.app"

  publish:
    if: github.head_ref == 'v1.0.0-dev'
    needs: [build-sign, startup-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.0.0-release-candidate
          path: dist
      - name: Publish bilingual verified v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 中文

          **柳之卦 · Ryu's Gua v1.0.0 正式版**

          1.0 建立新的正式 Android 应用身份：
          - 包名：`com.ryusgua.app`
          - 应用名：**柳之卦**
          - `versionCode 100` / `versionName 1.0.0`
          - Standard APK：Android 8.0+（API 26+）
          - Legacy APK：Android 6.0+（API 23+）
          - 1.0 与 0.9.x 可并存，不提供覆盖安装或旧数据迁移

          发布前已完成：Public CI、正式签名、签名证书一致性校验、Standard/API 35 启动测试、Legacy/API 23 启动测试、SHA-256 校验。

          `RyusGua-v1.0.0-signing-backup-encrypted.zip` 是**加密后的**长期签名备份；解密私钥不在仓库和 Release 中，请离线保存单独提供的 recovery private key。

          ## English

          **Ryu's Gua v1.0.0 stable release**

          Version 1.0 establishes a new formal Android identity:
          - Package: `com.ryusgua.app`
          - App name: **柳之卦 / Ryu's Gua**
          - `versionCode 100` / `versionName 1.0.0`
          - Standard APK: Android 8.0+ (API 26+)
          - Legacy APK: Android 6.0+ (API 23+)
          - 1.0 intentionally coexists with 0.9.x and does not provide in-place or data migration

          Before publication this build passed public CI, formal release signing, signing-certificate consistency checks, Standard/API 35 startup validation, Legacy/API 23 startup validation, and SHA-256 verification.

          `RyusGua-v1.0.0-signing-backup-encrypted.zip` is an **encrypted** long-term signing backup. The recovery private key is intentionally not stored in the repository or Release and must be kept offline.

          ### Reference / 参考
          This remains an independent Android reconstruction. See `docs/REFERENCES.md` and `THIRD_PARTY_NOTICES.md` for references and attribution.
          EOF
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 \
            --target "$HEAD_SHA" \
            --title "柳之卦 · Ryu's Gua v1.0.0" \
            --notes-file /tmp/release-notes.md \
            dist/RyusGua-v1.0.0-standard.apk \
            dist/RyusGua-v1.0.0-legacy.apk \
            dist/Ryus-Gua-v1.0.0-source.zip \
            dist/RyusGua-v1.0.0-signing-backup-encrypted.zip \
            dist/signing-certificate.txt \
            dist/sha256-release.txt
      - name: Re-download public release and verify hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v100-public && mkdir -p /tmp/v100-public
          gh release download v1.0.0 -D /tmp/v100-public
          (cd /tmp/v100-public && sha256sum -c sha256-release.txt)
