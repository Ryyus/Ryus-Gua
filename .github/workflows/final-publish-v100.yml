name: Final publish Ryu's Gua v1.0.0

on:
  pull_request:
    branches: ["main"]
    paths: [".v100-final-publish"]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'v1.0.0-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.0.0-release-candidate
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32363398873

      - name: Verify original signed release candidate
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c sha256-release.txt
          unzip -t RyusGua-v1.0.0-standard.apk >/dev/null
          unzip -t RyusGua-v1.0.0-legacy.apk >/dev/null
          unzip -t Ryus-Gua-v1.0.0-source.zip >/dev/null
          unzip -t RyusGua-v1.0.0-signing-backup-encrypted.zip >/dev/null

      - name: Publish v1.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 中文

          **柳之卦 · Ryu's Gua v1.0.0 正式版**

          1.0 建立新的正式 Android 应用身份：
          - 包名：`com.ryusgua.app`
          - 应用名：**柳之卦**
          - `versionCode 100` / `versionName 1.0.0`
          - Standard APK：Android 8.0+（API 26+）
          - Legacy APK：Android 6.0+（API 23+）
          - 1.0 与 0.9.x 可并存，不提供覆盖安装或旧数据迁移

          发布前已完成：Public Android CI、正式签名、Standard/Legacy 同证书校验、Legacy/API 23 启动测试、Standard/API 35 macOS 硬件加速启动测试、SHA-256 校验。

          `RyusGua-v1.0.0-signing-backup-encrypted.zip` 是加密后的长期签名备份。恢复私钥不存储在仓库或 Release 中，应与公开发布物分开离线保存。

          ## English

          **Ryu's Gua v1.0.0 stable release**

          Version 1.0 establishes the new formal Android identity:
          - Package: `com.ryusgua.app`
          - App name: **柳之卦 / Ryu's Gua**
          - `versionCode 100` / `versionName 1.0.0`
          - Standard APK: Android 8.0+ (API 26+)
          - Legacy APK: Android 6.0+ (API 23+)
          - v1.0 intentionally coexists with 0.9.x and does not perform an in-place or data migration

          Before publication, the exact release candidate passed public Android CI, formal signing and same-certificate verification, Legacy/API 23 startup testing, Standard/API 35 startup testing on a hardware-accelerated macOS runner, and SHA-256 verification.

          `RyusGua-v1.0.0-signing-backup-encrypted.zip` is an encrypted long-term signing backup. Its recovery private key is intentionally kept outside the repository and Release.

          ### Reference / 参考
          This remains an independent Android reconstruction. See `docs/REFERENCES.md` and `THIRD_PARTY_NOTICES.md` for references and attribution.
          EOF

          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 \
            --target 3ab4d0571b84119bef663dd470119c4e63121cc6 \
            --title "柳之卦 · Ryu's Gua v1.0.0" \
            --notes-file /tmp/release-notes.md \
            dist/RyusGua-v1.0.0-standard.apk \
            dist/RyusGua-v1.0.0-legacy.apk \
            dist/Ryus-Gua-v1.0.0-source.zip \
            dist/RyusGua-v1.0.0-signing-backup-encrypted.zip \
            dist/signing-certificate.txt \
            dist/sha256-release.txt

      - name: Re-download and verify public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v100-public && mkdir -p /tmp/v100-public
          gh release download v1.0.0 -D /tmp/v100-public
          cd /tmp/v100-public
          sha256sum -c sha256-release.txt
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "6"
          gh release view v1.0.0 --json tagName,isDraft,isPrerelease --jq '.tagName == "v1.0.0" and (.isDraft|not) and (.isPrerelease|not)' | grep -q true
