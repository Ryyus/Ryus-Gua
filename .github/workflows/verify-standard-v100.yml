name: Verify Ryu's Gua v1.0.0 Standard on macOS

on:
  pull_request:
    branches: ["main"]
    paths: [".v100-macos-trigger"]

permissions:
  contents: read

jobs:
  standard-startup-test:
    if: github.head_ref == 'v1.0.0-dev'
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: v1.0.0-release-candidate
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32363398873
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            adb wait-for-device
            adb install -r "dist/RyusGua-v1.0.0-standard.apk"
            adb logcat -c
            adb shell am force-stop com.ryusgua.app || true
            adb shell am start -W -n com.ryusgua.app/.MainActivity | tee /tmp/start.txt
            grep -q "Status: ok" /tmp/start.txt
            sleep 5
            adb shell ps | grep -q "com.ryusgua.app"
