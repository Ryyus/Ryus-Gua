name: Apply v1.1.2 boot styles

on:
  pull_request:
    branches: ["main"]
    paths:
      - "tools/apply_v112_boot_styles.py"
      - "v112-boot-trigger.txt"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v1.1.2-boot-styles'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1.2-boot-styles
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply seven boot-screen styles
        run: |
          python tools/apply_v112_boot_styles.py
          rm -f tools/apply_v112_boot_styles.py v112-boot-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add seven selectable boot-screen styles"
          git push origin HEAD:v1.1.2-boot-styles
