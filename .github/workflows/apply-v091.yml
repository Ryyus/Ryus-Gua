name: Apply v0.9.1 source patch

on:
  push:
    branches: ["main"]
    paths: [".v091-apply-trigger"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.1-dev
          fetch-depth: 0
      - name: Apply exact v0.9.1 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.v091-patch.gz.b64 | base64 -d | gzip -d > /tmp/v091.patch
          patch -p1 < /tmp/v091.patch
          grep -q "versionCode 10" app/build.gradle
          grep -q "versionName '0.9.1'" app/build.gradle
          grep -q 'startFormalCasting' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'verticalFlipEnabled' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q "RYU'S GUA / 0.9.1" app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q '作者 · Ryyus' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'showAiSettingsPanel(false, () -> aiSummaryView.setText' app/src/main/java/com/zhanggua/app/MainActivity.java
          git rm -f .v091-patch.gz.b64 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Implement v0.9.1 formal casting and UI fixes'
          git push origin HEAD:v0.9.1-dev
