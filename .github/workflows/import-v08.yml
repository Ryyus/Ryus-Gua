name: Finalize ZhangGua v0.8 migration

on:
  push:
    branches: ["main"]
    paths: [".import-v08-trigger"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify legacy v0.8 assets
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://github.com/Ryyus/Ryyus.github.io/releases/download/zhanggua-v0.8/ZhangGua-v0.8-release.apk \
            -o /tmp/ZhangGua-v0.8-release.apk
          unzip -t /tmp/ZhangGua-v0.8-release.apk >/dev/null
          ACTUAL=$(sha256sum /tmp/ZhangGua-v0.8-release.apk | awk '{print $1}')
          test "$ACTUAL" = '582159cde0b2fd2c469184e99e4c1db44719547c101ddcbe9e21f31eba1e780b'
          echo "APK_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Create repository-native source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'versionName .0.8.0.' app/build.gradle
          grep -q '掌卦' app/src/main/res/values/strings.xml
          mkdir -p /tmp/release-assets
          cp /tmp/ZhangGua-v0.8-release.apk /tmp/release-assets/ZhangGua-v0.8-release.apk
          printf '%s  %s\n' "$APK_SHA256" 'ZhangGua-v0.8-release.apk' > /tmp/release-assets/sha256.txt
          zip -qr /tmp/release-assets/Ryus-Gua-v0.8-source.zip . \
            -x '.git/*' '.gradle/*' '**/build/*' 'local.properties' '.import-v08-trigger' '.github/workflows/import-v08.yml'

      - name: Publish v0.8 release in new repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.8.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete v0.8.0 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v0.8.0 \
            /tmp/release-assets/ZhangGua-v0.8-release.apk \
            /tmp/release-assets/Ryus-Gua-v0.8-source.zip \
            /tmp/release-assets/sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "柳之卦 · Ryu's Gua v0.8 · 掌卦 Android" \
            --notes "Repository migration release. Android application name remains 掌卦 and package remains com.zhanggua.app. v0.8 includes classic floating / physics launch coin animations and compact grouped settings. References: eXphinx related implementation/post; zg.yichenlab.com related web implementation; Johnson-Jia/liuyao-divination (MIT) for ZhouYi/divination reference data. APK SHA-256: $APK_SHA256"

          rm -rf /tmp/verify-public
          mkdir -p /tmp/verify-public
          gh release download v0.8.0 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.8-release.apk' --dir /tmp/verify-public
          PUBLIC_SHA=$(sha256sum /tmp/verify-public/ZhangGua-v0.8-release.apk | awk '{print $1}')
          test "$PUBLIC_SHA" = "$APK_SHA256"
