name: Apply v0.9.2 source patch

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'v0.9.2-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9.2-dev
          fetch-depth: 0
      - name: Apply exact v0.9.2 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "versionCode 11" app/build.gradle && grep -q 'reasoningToggleButton' app/src/main/java/com/zhanggua/app/MainActivity.java; then
            echo 'v0.9.2 patch already applied'
            exit 0
          fi
          git fetch origin main
          git show origin/main:.v092-patch.gz.b64 | base64 -d | gzip -d > /tmp/v092.patch
          patch -p2 < /tmp/v092.patch
          grep -q "versionCode 11" app/build.gradle
          grep -q "versionName '0.9.2'" app/build.gradle
          grep -q 'reasoningToggleButton' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q '思考过程（摘要）' app/src/main/java/com/zhanggua/app/MainActivity.java
          grep -q 'onReasoningDelta' app/src/main/java/com/zhanggua/app/AiClient.java
          grep -q 'response.reasoning_summary_text.delta' app/src/main/java/com/zhanggua/app/AiClient.java
          grep -q 'reasoning_content' app/src/main/java/com/zhanggua/app/AiClient.java
          grep -q 'max_output_tokens' app/src/main/java/com/zhanggua/app/AiClient.java
          git rm -f .v092-branch-trigger 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Implement v0.9.2 expandable AI reasoning'
          git push origin HEAD:v0.9.2-dev
