name: Build v1.4.0 unsigned release

on:
  pull_request:
    branches: ["main"]
    paths:
      - "v140-artifact-trigger.txt"

permissions:
  contents: read

jobs:
  build:
    if: github.head_ref == 'v1.4.0-artifact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.0-artifact
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and verify unsigned Release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleStandardRelease assembleLegacyRelease
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk dist/RyusGua-v1.4.0-standard-unsigned-aligned.apk
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/legacy/release/app-legacy-release-unsigned.apk dist/RyusGua-v1.4.0-legacy-unsigned-aligned.apk
          "$BT/zipalign" -c -v 4 dist/RyusGua-v1.4.0-standard-unsigned-aligned.apk >/dev/null
          "$BT/zipalign" -c -v 4 dist/RyusGua-v1.4.0-legacy-unsigned-aligned.apk >/dev/null
          "$BT/aapt" dump badging dist/RyusGua-v1.4.0-standard-unsigned-aligned.apk | tee /tmp/standard.txt
          "$BT/aapt" dump badging dist/RyusGua-v1.4.0-legacy-unsigned-aligned.apk | tee /tmp/legacy.txt
          grep -q "package: name='com.ryusgua.app' versionCode='140' versionName='1.4.0'" /tmp/standard.txt
          grep -q "package: name='com.ryusgua.app' versionCode='140' versionName='1.4.0'" /tmp/legacy.txt
          grep -q "sdkVersion:'26'" /tmp/standard.txt
          grep -q "sdkVersion:'23'" /tmp/legacy.txt
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/*.apk > dist/sha256-unsigned.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v1.4.0-unsigned-release-candidate
          path: dist/*
          retention-days: 30
