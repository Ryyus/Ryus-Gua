name: Publish Ryu's Gua v0.9.2 verified release

on:
  push:
    branches: ["main"]
    paths: [".v092-artifact-url"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch verified signed bundle
        shell: bash
        run: |
          set -euo pipefail
          URL=$(cat .v092-artifact-url)
          curl -fL --retry 3 --retry-delay 2 "$URL" -o /tmp/v092-artifact.zip
          rm -rf /tmp/v092 && mkdir -p /tmp/v092
          unzip -q /tmp/v092-artifact.zip -d /tmp/v092
          APK=/tmp/v092/ZhangGua-v0.9.2-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          test "$SHA" = '2cfbbb0bdaf69819036a749adc1371d4b7b1d7c3d9e5826f169651ee517ee37e'
          echo "APK_SHA=$SHA" >> "$GITHUB_ENV"

      - name: Clean migration helpers and refresh docs
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .v092-patch.gz.b64 .github/workflows/apply-v092.yml 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          s=p.read_text()
          s=s.replace('Version: `0.9.1` (`versionCode 10`)', 'Version: `0.9.2` (`versionCode 11`)')
          if '- **可折叠思考过程**' not in s:
              anchor='- **AI 流式输出**：Responses API / Chat Completions 生成过程中逐段显示\n'
              add=('- **可折叠思考过程**：AI reasoning/thinking 与最终解读分离，默认折叠，可由用户展开查看\n'
                   '- **精简解卦**：提示词将最终解读控制在约 300–450 个中文字符，支持的模型使用较低推理强度 / verbosity\n')
              s=s.replace(anchor, anchor+add)
          p.write_text(s)
          PY
          cat > update/latest.json <<'JSON'
          {
            "versionCode": 11,
            "versionName": "0.9.2",
            "title": "掌卦 v0.9.2 可用",
            "notes": "AI 思考过程与最终解读分离，默认折叠并可手动展开；缩短解读篇幅，并降低支持模型的思考强度。",
            "releasePage": "https://github.com/Ryyus/Ryus-Gua/releases/tag/v0.9.2",
            "apkUrl": "https://github.com/Ryyus/Ryus-Gua/releases/download/v0.9.2/ZhangGua-v0.9.2-release.apk",
            "sha256": "2cfbbb0bdaf69819036a749adc1371d4b7b1d7c3d9e5826f169651ee517ee37e"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md update/latest.json
          git diff --cached --quiet || git commit -m 'Finalize Ryu’s Gua v0.9.2 release metadata'
          git push origin main

      - name: Build clean repository source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-assets
          cp /tmp/v092/ZhangGua-v0.9.2-release.apk /tmp/release-assets/ZhangGua-v0.9.2-release.apk
          printf '%s  %s\n' "$APK_SHA" 'ZhangGua-v0.9.2-release.apk' > /tmp/release-assets/sha256.txt
          zip -qr /tmp/release-assets/Ryus-Gua-v0.9.2-source.zip . \
            -x '.git/*' '.gradle/*' '**/build/*' 'local.properties' \
               '.v092-*' '.github/workflows/publish-v092.yml'

      - name: Publish and verify v0.9.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.9.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete v0.9.2 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v0.9.2 \
            /tmp/release-assets/ZhangGua-v0.9.2-release.apk \
            /tmp/release-assets/Ryus-Gua-v0.9.2-source.zip \
            /tmp/release-assets/sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "柳之卦 · Ryu's Gua v0.9.2 · 掌卦 Android" \
            --notes "AI reasoning/thinking is now separated from final interpretation text and shown in a collapsed-by-default expandable section when the provider exposes it. OpenAI Responses reasoning summaries, DeepSeek-style reasoning_content, compatible thinking fields and inline <think> streams are handled separately. Final interpretations are shortened to roughly 300–450 Chinese characters, and supported models use lower reasoning effort/verbosity. APK SHA-256: $APK_SHA"
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          gh release download v0.9.2 --repo "$GITHUB_REPOSITORY" --pattern 'ZhangGua-v0.9.2-release.apk' --dir /tmp/verify
          PUBLIC_SHA=$(sha256sum /tmp/verify/ZhangGua-v0.9.2-release.apk | awk '{print $1}')
          test "$PUBLIC_SHA" = "$APK_SHA"
          printf 'v0.9.2 release verified\nAPK SHA-256: %s\n' "$PUBLIC_SHA" > V0.9.2_RELEASE_VERIFIED
          git add V0.9.2_RELEASE_VERIFIED
          git commit -m 'Mark v0.9.2 release verified'
          git push origin main
